name: Verify V1

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript validation
        run: bun run lint
      - name: Production build
        run: bun run build
      - name: ProInspect platform handoff contract
        run: bun run platform:verify
      - name: Public signing origin security contract
        run: bun run signing-origin:verify
      - name: Validate Cloudflare static headers
        shell: bash
        run: |
          set -euo pipefail
          if grep -nF '\\n' public/_headers; then
            echo "public/_headers contains literal escaped newlines and would be rejected by Cloudflare."
            exit 1
          fi
          awk '
            /^\// { route=1; next }
            /^[[:space:]]+[A-Za-z0-9-]+:/ { next }
            /^[[:space:]]*$/ { next }
            { print "Invalid _headers line " NR ": " $0; bad=1 }
            END { exit bad ? 1 : 0 }
          ' public/_headers

      - name: PDF renderer regression
        run: |
          mkdir -p render-artifacts
          PDF_VERIFY_OUTPUT_DIR=render-artifacts bun run pdf:verify
      - name: Upload PDF regression artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdf-regression-artifacts
          path: render-artifacts/*.pdf
          if-no-files-found: error
          retention-days: 1
      - name: Wrangler deployment dry run
        run: bunx wrangler deploy --dry-run --outdir .wrangler-dry
