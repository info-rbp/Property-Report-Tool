name: Verify V1

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript validation
        run: bun run lint
      - name: Production build
        run: bun run build
      - name: PDF renderer regression
        env:
          PDF_VERIFY_OUTPUT_DIR: /tmp/report-template-regression
        run: |
          mkdir -p /tmp/report-template-regression
          bun run pdf:verify
      - name: Upload report template regression PDFs
        uses: actions/upload-artifact@v4
        with:
          name: routine-exit-template-regression
          path: /tmp/report-template-regression/*.pdf
          retention-days: 1
      - name: Wrangler deployment dry run
        run: bunx wrangler deploy --dry-run --outdir .wrangler-dry
