name: Verify V1

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript validation
        run: bun run lint
      - name: Production build
        run: bun run build
      - name: PDF renderer regression
        run: |
          mkdir -p render-artifacts
          PDF_VERIFY_OUTPUT_DIR=render-artifacts bun run pdf:verify
      - name: Upload PDF regression artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdf-regression-artifacts
          path: render-artifacts/*.pdf
          if-no-files-found: error
          retention-days: 1
      - name: Wrangler deployment dry run
        run: bunx wrangler deploy --dry-run --outdir .wrangler-dry
