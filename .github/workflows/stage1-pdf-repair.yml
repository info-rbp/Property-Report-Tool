name: Stage 1 report upload hardening
on:
  push:
    branches: [hardening/final-application-freeze]
    paths: [scripts/stage1-pdf-repair.py, .github/workflows/stage1-pdf-repair.yml]
permissions:
  contents: read
jobs:
  repair-and-test:
    if: github.ref == 'refs/heads/hardening/final-application-freeze'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Apply bounded PDF validation repair on feature branch only
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/hardening/final-application-freeze
          git merge-base --is-ancestor 2907485ff3b7550691c3749d710bbe263e0a22ef HEAD
          python3 scripts/stage1-pdf-repair.py
          git diff --check
          git add worker/index.ts scripts/verifyApiIntegration.sh .github/workflows/verify.yml
          git rm scripts/stage1-pdf-repair.py
          git -c user.name='ProInspect branch maintenance' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: reject non-PDF bytes before report finalisation and test production auth boundary'
          git push origin HEAD:refs/heads/hardening/final-application-freeze
          git rev-parse HEAD > stage1-report-sha.txt
      - run: bun install --frozen-lockfile
      - run: bun run security:verify
      - run: bun run lint
      - run: bun run build
      - run: bun scripts/verifyWorkerBoundary.ts
      - run: bun run api:verify
      - run: mkdir -p render-artifacts && PDF_VERIFY_OUTPUT_DIR=render-artifacts bun run pdf:verify
      - run: bunx wrangler deploy --dry-run --outdir .wrangler-dry
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-stage1-evidence
          path: |
            stage1-report-sha.txt
            render-artifacts/*.pdf
          retention-days: 14
          if-no-files-found: error
