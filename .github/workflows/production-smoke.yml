name: Production Smoke

on:
  push:
    branches:
      - main

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare production deployment
        shell: bash
        run: |
          set -euo pipefail
          HEALTH_URL="https://sign.proinspect.systems/api/public/workflow-health"
          ROOT_URL="https://sign.proinspect.systems/"

          for attempt in $(seq 1 24); do
            tmp_body="$(mktemp)"
            http_status="$(curl -sS --max-time 15 -o "$tmp_body" -w '%{http_code}' "$HEALTH_URL" || true)"
            body="$(cat "$tmp_body" 2>/dev/null || true)"
            rm -f "$tmp_body"

            echo "Health HTTP status: ${http_status:-curl-error}"
            echo "Health response: ${body:-<empty>}"

            if printf '%s' "$body" | grep -q '"status":"ok"' &&
               printf '%s' "$body" | grep -q '"workflowSchema":"ready"' &&
               printf '%s' "$body" | grep -q '"resendConfigured":true"'; then
              echo "Workflow health is ready."
              root_status="$(curl -sS -o /tmp/root.html -w '%{http_code}' --max-time 15 "$ROOT_URL" || true)"
              test "$root_status" = "200"
              grep -q "ProInspect" /tmp/root.html
              exit 0
            fi

            echo "Production deployment not ready yet (attempt $attempt/24)."
            sleep 10
          done

          echo "Production health did not become ready."
          exit 1
