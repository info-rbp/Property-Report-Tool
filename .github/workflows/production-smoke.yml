name: Production Smoke

on:
  push:
    branches:
      - main

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public signing and protected editor boundaries
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC_ORIGIN="https://signing.proinspect.systems"
          HEALTH_URL="$PUBLIC_ORIGIN/api/public/workflow-health"
          ROOT_URL="$PUBLIC_ORIGIN/sign/health-check"
          PROTECTED_API="$PUBLIC_ORIGIN/api/me"
          EDITOR_URL="https://report.creation.proinspect.systems/"

          for attempt in $(seq 1 24); do
            tmp_body="$(mktemp)"
            http_status="$(curl -sS --max-time 15 -o "$tmp_body" -w '%{http_code}' "$HEALTH_URL" || true)"
            body="$(cat "$tmp_body" 2>/dev/null || true)"
            rm -f "$tmp_body"

            echo "Public signing health HTTP status: ${http_status:-curl-error}"
            echo "Public signing health response: ${body:-<empty>}"

            if [ "$http_status" = "200" ] &&
               printf '%s' "$body" | grep -q '"status":"ok"' &&
               printf '%s' "$body" | grep -q '"workflowSchema":"ready"' &&
               printf '%s' "$body" | grep -q '"resendConfigured":true"' &&
               printf '%s' "$body" | grep -q '"signingBaseConfigured":true"' &&
               printf '%s' "$body" | grep -q '"proinspectHandoffConfigured":true"' &&
               printf '%s' "$body" | grep -q '"proinspectIngestConfigured":true"'; then
              root_status="$(curl -sS -o /tmp/root.html -w '%{http_code}' --max-time 15 "$ROOT_URL" || true)"
              test "$root_status" = "200"
              grep -q "ProInspect" /tmp/root.html

              protected_status="$(curl -sS -o /tmp/protected.json -w '%{http_code}' --max-time 15 "$PROTECTED_API" || true)"
              case "$protected_status" in
                302|401|403) ;;
                *) echo "Protected Report Tool API unexpectedly public on signing hostname: $protected_status"; cat /tmp/protected.json; exit 1 ;;
              esac

              editor_status="$(curl -sS -o /tmp/editor.html -w '%{http_code}' --max-time 15 "$EDITOR_URL" || true)"
              case "$editor_status" in
                302|401|403) ;;
                *) echo "Staff editor hostname is not protected by Cloudflare Access: $editor_status"; exit 1 ;;
              esac

              echo "Dedicated public signing routes are healthy and all non-public Report Tool APIs remain Access-protected."
              exit 0
            fi

            echo "Production deployment not ready yet (attempt $attempt/24)."
            sleep 10
          done

          echo "Public signing production health did not become ready."
          exit 1
